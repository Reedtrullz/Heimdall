name: CI

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '22'
  IMAGE_REPOSITORY: ghcr.io/reedtrullz/heimdall

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/install-deps
      - run: pnpm run check:native-prebuild-pins
      # Moderate+ production vulnerabilities should fail CI; omit dev deps to avoid tool noise.
      - run: pnpm run audit:prod
      # High+ vulnerabilities anywhere in the tree should fail CI, including dev-tool advisories.
      - run: pnpm run audit:high
      - run: pnpm run lint --max-warnings=0
      - run: pnpm run typecheck
      - run: pnpm test
        env:
          CI: true
        timeout-minutes: 5
      - run: pnpm run test:coverage
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vitest-results-${{ github.sha }}
          path: test-results/vitest/
          if-no-files-found: ignore

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/install-deps
      # Prevent production builds from silently using mock data in a deployed
      # environment. The value is inlined at client build time; this guard
      # fails the workflow before pnpm run build when the env is set.
      - name: Assert production builds never use mock data
        run: |
          if [ "${NEXT_PUBLIC_USE_MOCK_DATA:-}" = "true" ]; then
            echo "::error::NEXT_PUBLIC_USE_MOCK_DATA must not be 'true' in production builds"
            exit 1
          fi
          echo "Mock data guard passed"
      - run: pnpm run build
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-output-${{ github.sha }}
          path: .next/
          if-no-files-found: ignore

  cloudflare-build:
    name: Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/install-deps
      - run: pnpm run build:vinext
        env:
          CI: true
          HEIMDALL_RELEASE_VERSION: sha-${{ github.sha }}

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Non-cone sparse checkout keeps every tracked path except the private vault, which is never materialized.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/group_vars/vps/vault.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/install-deps
      # One existing browser install, placed outside the masked runner home so the fee-demand namespace guard can read it.
      - run: pnpm exec playwright install --with-deps
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/fee-demand-browsers
      - run: pnpm run e2e
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/fee-demand-browsers
      - name: Fee-demand fixture guards
        run: |
          set -euo pipefail
          pnpm exec playwright test --list > "$RUNNER_TEMP/primary-tests.txt"
          if grep -q 'fee-revenue-demand.measure' "$RUNNER_TEMP/primary-tests.txt"; then
            echo 'ordinary Playwright suite must not discover the fee-demand measurement' >&2
            exit 1
          fi
          pnpm exec playwright test --list -c playwright.fee-demand.config.ts > "$RUNNER_TEMP/fee-demand-tests.txt"
          grep -q 'fee-revenue-demand.measure' "$RUNNER_TEMP/fee-demand-tests.txt"
          node --test e2e/helpers/fee-revenue-egress.test.cjs
          # Standalone needs its static assets and public files at the Dockerfile paths.
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -R public .next/standalone/public; fi
          chmod -R a-w .next/standalone
          FEE_NATIVE_BROWSERS_SHA256="$(node -p "require('./e2e/helpers/fee-revenue-egress.cjs').artifactDigest(process.env.PLAYWRIGHT_BROWSERS_PATH)")"
          export FEE_NATIVE_BROWSERS_SHA256 FEE_NATIVE_PROFILE=namespace-v1
          node e2e/helpers/fee-revenue-egress.cjs --baseline "$PWD/.next/standalone" "$GITHUB_SHA"
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/fee-demand-browsers
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results-${{ github.sha }}
          path: test-results/playwright/
          if-no-files-found: ignore

  docker-build:
    name: Docker build verification
    needs: [test, build, e2e]
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image version
        run: echo "IMAGE_VERSION=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build image without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
            NEXT_PUBLIC_THORNODE_API=https://gateway.liquify.com/chain/thorchain_api
            NEXT_PUBLIC_MIDGARD_API=https://gateway.liquify.com/chain/thorchain_midgard
            NEXT_PUBLIC_THORCHAIN_RPC=https://gateway.liquify.com/chain/thorchain_rpc
            NEXT_PUBLIC_TRACK_API=https://track.thorchain.org/
            NEXT_PUBLIC_MIDGARD_FALLBACK=https://midgard.thorchain.network
            NEXT_PUBLIC_APP_URL=https://bond.thorchain.no
            NEXT_PUBLIC_THORCHAIN_NETWORK=mainnet
            NEXT_PUBLIC_COINGECKO_API=https://api.coingecko.com/api/v3
            NEXT_PUBLIC_USE_MOCK_DATA=false

  publish:
    name: Build & publish image
    needs: [test, build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image version
        run: echo "IMAGE_VERSION=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=${{ env.IMAGE_VERSION }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
            NEXT_PUBLIC_THORNODE_API=https://gateway.liquify.com/chain/thorchain_api
            NEXT_PUBLIC_MIDGARD_API=https://gateway.liquify.com/chain/thorchain_midgard
            NEXT_PUBLIC_THORCHAIN_RPC=https://gateway.liquify.com/chain/thorchain_rpc
            NEXT_PUBLIC_TRACK_API=https://track.thorchain.org/
            NEXT_PUBLIC_MIDGARD_FALLBACK=https://midgard.thorchain.network
            NEXT_PUBLIC_APP_URL=https://bond.thorchain.no
            NEXT_PUBLIC_THORCHAIN_NETWORK=mainnet
            NEXT_PUBLIC_COINGECKO_API=https://api.coingecko.com/api/v3
            NEXT_PUBLIC_USE_MOCK_DATA=false

      - name: Summary
        run: |
          echo "### Image published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tags:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull with: \`docker pull ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_VERSION }}\`" >> $GITHUB_STEP_SUMMARY

  deploy-cloudflare:
    name: Deploy Cloudflare Worker
    needs: [test, build, e2e, cloudflare-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.HEIMDALL_CLOUDFLARE_DEPLOY_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/install-deps
      # deploy:vinext = build:vinext (vite + root-externals rewrite) then
      # vinext-cloudflare deploy --skip-build. Do not call vinext-cloudflare
      # deploy alone: it rebuilds and would drop the rewrite (#50 regression).
      - name: Deploy exact source version
        run: pnpm run deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.HEIMDALL_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.HEIMDALL_CLOUDFLARE_ACCOUNT_ID }}
          HEIMDALL_RELEASE_VERSION: sha-${{ github.sha }}
      - name: Verify Worker version and readiness
        run: |
          expected="sha-${GITHUB_SHA}"
          for route in health ready; do
            for attempt in {1..30}; do
              if body=$(curl --fail --silent --show-error --max-time 8 "https://heimdall.reidjoss.workers.dev/api/${route}") &&
                jq -e --arg version "$expected" --arg status "$(test "$route" = health && echo healthy || echo ready)" '.version == $version and .status == $status' <<< "$body" >/dev/null; then
                continue 2
              fi
              sleep 3
            done
            echo "::error::${route} did not report ${expected} after 30 attempts"
            exit 1
          done
