name: Install pnpm dependencies
description: Enable pnpm via Corepack (version pinned by package.json packageManager) and install the frozen lockfile, including lockfile-selected optional platform packages.

runs:
  using: composite
  steps:
    - name: Enable pnpm via Corepack
      shell: bash
      run: corepack enable

    - name: pnpm install --frozen-lockfile
      shell: bash
      # pnpm installs the lockfile's optional packages for the runner platform by default.
      run: pnpm install --frozen-lockfile
