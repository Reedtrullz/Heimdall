- name: Deploy Heimdall to VPS
  hosts: vps
  gather_facts: false
  vars:
    docker_image_repository: "ghcr.io/reedtrullz/heimdall"
    container_name: "heimdall"
    git_sha: "{{ lookup('pipe', 'git -C ' ~ playbook_dir ~ ' rev-parse --short HEAD 2>/dev/null || echo unknown') }}"
    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('sha-' ~ git_sha, true) }}"

  pre_tasks:
    - name: Check Cloudflare primary marker
      ansible.builtin.stat:
        path: /etc/heimdall/cloudflare-primary
      register: cloudflare_primary_marker

    - name: Require explicit VPS rollback after Cloudflare cutover
      ansible.builtin.assert:
        that:
          - not cloudflare_primary_marker.stat.exists or lookup('env', 'HEIMDALL_VPS_ROLLBACK') == '1'
        fail_msg: "Cloudflare is primary. Set HEIMDALL_VPS_ROLLBACK=1 for an intentional VPS rollback."

    - name: Validate immutable image tag
      assert:
        that:
          - image_tag is match('^sha-[0-9a-f]{7,40}$')
        fail_msg: "IMAGE_TAG must be an immutable sha-<7-40 lowercase hex> tag; mutable tags like latest are not allowed."

    - name: Get current container image
      community.docker.docker_container_info:
        name: "{{ container_name }}"
      register: current_container
      ignore_errors: yes

    - name: Set previous image fact
      set_fact:
        previous_image: "{{ (current_container.container.Image | default(current_container.container.Config.Image | default('none', true), true)) if (current_container.container is defined) else 'none' }}"
        previous_version: "{{ ((current_container.container.Config.Env | default([]) | select('match', '^VERSION=') | list | first | default('VERSION=', true) | regex_replace('^VERSION=', '')) | default(current_container.container.Config.Image | default('none', true), true)) if (current_container.container is defined) else 'none' }}"

  tasks:
    - name: Pull immutable image from GHCR
      community.docker.docker_image:
        name: "{{ docker_image_repository }}:{{ image_tag }}"
        source: pull
        force_source: yes  # verify the immutable deploy tag is present in GHCR

    - name: Ensure Heimdall data directory exists
      ansible.builtin.file:
        path: /opt/apps/heimdall/data
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0700"

    - name: Stop and remove existing container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent

    - name: Start new container
      no_log: "{{ (vault_coinapi_key | default('', true) | length > 0) or (web_push_vapid_private_key | default('', true) | length > 0) or (heimdall_notification_runner_token | default('', true) | length > 0) }}"
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image_repository }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "127.0.0.1:3001:3000"
        volumes:
          - "/opt/apps/heimdall/data:/data"
        log_driver: "json-file"
        log_options:
          max-size: "10m"
          max-file: "3"
        healthcheck:
          test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 40s
        env:
          NODE_ENV: production
          PORT: "3000"
          HOSTNAME: "0.0.0.0"
          VERSION: "{{ image_tag }}"
          NEXT_PUBLIC_THORNODE_API: "{{ thornode_api | default('https://gateway.liquify.com/chain/thorchain_api') }}"
          NEXT_PUBLIC_MIDGARD_API: "{{ midgard_api | default('https://gateway.liquify.com/chain/thorchain_midgard') }}"
          NEXT_PUBLIC_THORCHAIN_RPC: "{{ thorchain_rpc | default('https://gateway.liquify.com/chain/thorchain_rpc') }}"
          NEXT_PUBLIC_TRACK_API: "{{ track_api | default('https://track.thorchain.org/') }}"
          NEXT_PUBLIC_MIDGARD_FALLBACK: "{{ midgard_fallback | default('https://midgard.thorchain.network') }}"
          NEXT_PUBLIC_APP_URL: "{{ app_url | default('https://bond.thorchain.no') }}"
          NEXT_PUBLIC_THORCHAIN_NETWORK: "{{ thorchain_network | default('mainnet') }}"
          NEXT_PUBLIC_COINGECKO_API: "{{ coingecko_api | default('https://api.coingecko.com/api/v3') }}"
          NEXT_PUBLIC_USE_MOCK_DATA: "{{ use_mock_data | default('false') }}"
          # Server-side proxy route reads this; not bundled into client JS.
          THORNODE_API_URL: "{{ thornode_api | default('https://gateway.liquify.com/chain/thorchain_api') }}/thorchain"
          MIDGARD_API_URL: "{{ midgard_api | default('https://gateway.liquify.com/chain/thorchain_midgard') }}"
          MIDGARD_FALLBACK_URL: "{{ midgard_fallback | default('https://midgard.thorchain.network') }}"
          TRUST_PROXY_HEADERS: "{{ trust_proxy_headers | default('true') }}"
          TRUST_X_FORWARDED_FOR: "{{ trust_x_forwarded_for | default('false') }}"
          HEIMDALL_DATA_DIR: "/data"
          NOTIFICATION_POLL_INTERVAL_MS: "{{ notification_poll_interval_ms | default('60000') }}"
          WEB_PUSH_VAPID_PUBLIC_KEY: "{{ web_push_vapid_public_key | default('', true) }}"
          WEB_PUSH_VAPID_PRIVATE_KEY: "{{ web_push_vapid_private_key | default('', true) }}"
          WEB_PUSH_CONTACT: "{{ web_push_contact | default('mailto:alerts@bond.thorchain.no') }}"
          HEIMDALL_NOTIFICATION_RUNNER_TOKEN: "{{ heimdall_notification_runner_token | default('', true) }}"
          # Existing Ansible Vault variable; do not store or log the value in docs.
          COINAPI_KEY: "{{ vault_coinapi_key | default('', true) }}"

    - name: Wait for application to become ready
      uri:
        url: "http://127.0.0.1:3001/api/ready"
        return_content: yes
        timeout: 5
      register: readiness_check
      until: readiness_check is succeeded and ((readiness_check.json | default({})).status | default('')) == "ready"
      retries: 10
      delay: 5
      failed_when: false

    - name: Fail if application is not ready
      fail:
        msg: "Heimdall readiness check failed: {{ readiness_check }}"
      when:
        - readiness_check is not succeeded or ((readiness_check.json | default({})).status | default('')) != "ready"
        - previous_image == "none"

    - name: Rollback to previous image on failure
      no_log: "{{ (vault_coinapi_key | default('', true) | length > 0) or (web_push_vapid_private_key | default('', true) | length > 0) or (heimdall_notification_runner_token | default('', true) | length > 0) }}"
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ previous_image }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "127.0.0.1:3001:3000"
        volumes:
          - "/opt/apps/heimdall/data:/data"
        log_driver: "json-file"
        log_options:
          max-size: "10m"
          max-file: "3"
        healthcheck:
          test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 40s
        env:
          NODE_ENV: production
          PORT: "3000"
          HOSTNAME: "0.0.0.0"
          VERSION: "{{ previous_version }}"
          NEXT_PUBLIC_THORNODE_API: "{{ thornode_api | default('https://gateway.liquify.com/chain/thorchain_api') }}"
          NEXT_PUBLIC_MIDGARD_API: "{{ midgard_api | default('https://gateway.liquify.com/chain/thorchain_midgard') }}"
          NEXT_PUBLIC_THORCHAIN_RPC: "{{ thorchain_rpc | default('https://gateway.liquify.com/chain/thorchain_rpc') }}"
          NEXT_PUBLIC_TRACK_API: "{{ track_api | default('https://track.thorchain.org/') }}"
          NEXT_PUBLIC_MIDGARD_FALLBACK: "{{ midgard_fallback | default('https://midgard.thorchain.network') }}"
          NEXT_PUBLIC_APP_URL: "{{ app_url | default('https://bond.thorchain.no') }}"
          NEXT_PUBLIC_THORCHAIN_NETWORK: "{{ thorchain_network | default('mainnet') }}"
          NEXT_PUBLIC_COINGECKO_API: "{{ coingecko_api | default('https://api.coingecko.com/api/v3') }}"
          NEXT_PUBLIC_USE_MOCK_DATA: "{{ use_mock_data | default('false') }}"
          THORNODE_API_URL: "{{ thornode_api | default('https://gateway.liquify.com/chain/thorchain_api') }}/thorchain"
          MIDGARD_API_URL: "{{ midgard_api | default('https://gateway.liquify.com/chain/thorchain_midgard') }}"
          MIDGARD_FALLBACK_URL: "{{ midgard_fallback | default('https://midgard.thorchain.network') }}"
          TRUST_PROXY_HEADERS: "{{ trust_proxy_headers | default('true') }}"
          TRUST_X_FORWARDED_FOR: "{{ trust_x_forwarded_for | default('false') }}"
          HEIMDALL_DATA_DIR: "/data"
          NOTIFICATION_POLL_INTERVAL_MS: "{{ notification_poll_interval_ms | default('60000') }}"
          WEB_PUSH_VAPID_PUBLIC_KEY: "{{ web_push_vapid_public_key | default('', true) }}"
          WEB_PUSH_VAPID_PRIVATE_KEY: "{{ web_push_vapid_private_key | default('', true) }}"
          WEB_PUSH_CONTACT: "{{ web_push_contact | default('mailto:alerts@bond.thorchain.no') }}"
          HEIMDALL_NOTIFICATION_RUNNER_TOKEN: "{{ heimdall_notification_runner_token | default('', true) }}"
          COINAPI_KEY: "{{ vault_coinapi_key | default('', true) }}"
      when:
        - readiness_check is not succeeded or readiness_check.json.status != "ready"
        - previous_image != "none"
      register: rollback

    - name: Wait for rollback application to become ready
      uri:
        url: "http://127.0.0.1:3001/api/ready"
        return_content: yes
        timeout: 5
      register: rollback_readiness_check
      until: rollback_readiness_check is succeeded and ((rollback_readiness_check.json | default({})).status | default('')) == "ready"
      retries: 10
      delay: 5
      failed_when: false
      when:
        - rollback is defined
        - rollback.changed

    - name: Fail if rollback application is not ready
      fail:
        msg: "Deployment failed and rollback to {{ previous_image }} did not become ready: {{ rollback_readiness_check }}"
      when:
        - rollback is defined
        - rollback.changed
        - rollback_readiness_check is not succeeded or ((rollback_readiness_check.json | default({})).status | default('degraded')) != "ready"

    - name: Fail with rollback message
      fail:
        msg: "Deployment failed, rolled back to {{ previous_image }} and /api/ready is ready"
      when:
        - rollback is defined
        - rollback.changed



    - name: Verify container is running
      community.docker.docker_container_info:
        name: "{{ container_name }}"
      register: container_info

    - name: Report deployment status
      debug:
        msg: "✅ Heimdall deployed successfully: {{ container_info.container.State.Status }}"
# Vault vars available: vault_coinapi_key, vault_discord_token, vault_openrouter_api_key
